# Central configuration of the generative-screening pipeline (read by the scripts documented in reports/results_summary.md).
target_gap_eV: 1.4              # PBE-level (MP GGA/GGA+U) band-gap target; see manuscript for justification
gap_window_eV: 0.3              # half-width used for "hit" statistics in retrospective benchmark
hull_max_eV_per_atom: 0.10      # gate on predicted E_hull in the proposed ranking
kappa: 1.0                      # weight of ensemble spread in risk-adjusted costs
tolerance_window: [0.78, 1.10]  # permissive Goldschmidt window (screening, not proof)
diversity_min_distance: 0.5     # chemical-family (A/B/X Jaccard) distance between shortlisted candidates
shortlist_size: 5
ranked_table_size: 15
generator:
  library: mattergen (microsoft/mattergen, MIT)  # commit recorded in reports/execution_log.md
  guidance_factor: 2.0
  modes:
    uncond:   {model: mattergen_base}
    gap14:    {model: dft_band_gap, condition: {dft_band_gap: 1.4}}
    chem_hull: {model: chemical_system_energy_above_hull, condition: {energy_above_hull: 0.0, chemical_system: per-sample from work/systems_600.txt}}
predictor:
  library: alignn 2026.8.11 (alignn_atomwise_pure, torch 2.4.1+cu121)
  epochs: 40
  batch_size: 64
  ensemble_seeds: [0, 1, 2]
seeds: {data_split: 0, enumeration: 0, generation: [0, 1, 2, 3]}
